<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MITZIMBERG — Art Portfolio</title>
  <meta name="description" content="Art portfolio of Mitzimberg.">
  <meta name="theme-color" content="#fafafa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top">MITZIMBERG</a>
    <nav>
      <button type="button" class="nav-btn" id="socialsBtn">Contact Me</button>
    </nav>
  </header>

  <main id="top">
    <section id="work">
      <div class="filters" id="filters" role="tablist" aria-label="Filter artwork"></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <footer>© <span id="year"></span> Mitzimberg. All rights reserved.</footer>

  <div class="lightbox" id="lightbox" hidden aria-modal="true" role="dialog" aria-label="Artwork details">
    <button class="lb-close" id="lbClose" aria-label="Close">×</button>
    <button class="lb-nav prev" id="lbPrev" aria-label="Previous">‹</button>
    <div class="lb-body">
      <div class="lb-stage"><img id="lbImg" alt=""></div>
      <aside class="lb-details" id="lbDetails"></aside>
    </div>
    <button class="lb-nav next" id="lbNext" aria-label="Next">›</button>
  </div>

  <div class="modal" id="socialsModal" hidden aria-modal="true" role="dialog" aria-label="Socials">
    <div class="modal-card">
      <button class="modal-close" id="socialsClose" aria-label="Close">×</button>
      <h3>Socials</h3>
      <ul>
        <li><a href="https://instagram.com/b.mitzimberg" target="_blank" rel="noopener">Instagram</a></li>
        <li><a href="mailto:BlakeMitzimberg003@gmail.com">Email</a></li>
      </ul>
    </div>
  </div>

  <script src="artworks.js"></script>
  <script src="script.js"></script>
</body>
</html>
